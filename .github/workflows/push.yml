name: Plugins - CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ef2d5f15ea47259e126ed6ea0b63ee3e4c0a73a5 # ci-cd-workflows/v11.3.0
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      golangci-lint-version: '2.14.0'
      trufflehog-exclude-detectors: SentryToken
  publish-and-deploy:
    if: github.ref == 'refs/heads/main'
    uses: grafana/data-sources-ci-workflows/.github/workflows/cd-dev.yml@9a420bb406397ffef23fd07c3eea46bef441813c # main
    with:
      go-version: '1.27.0'
      golangci-lint-version: '2.14.0'
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
